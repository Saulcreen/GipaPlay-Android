plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
base { archivesName = 'GipaPlay' }
android {
    namespace 'com.gipaplay.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gipaplay.android'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
