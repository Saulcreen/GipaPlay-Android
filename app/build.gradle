plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
base { archivesName = 'GipaPlay' }
android {
    namespace 'com.gipaplay.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gipaplay.android'
        minSdk 23
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '2').toInteger() + 100
        versionName '1.1'
    }
    signingConfigs {
        gipaplay {
            storeFile file('gipaplay.jks')
            storePassword 'gipaplay123'
            keyAlias 'gipaplay'
            keyPassword 'gipaplay123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.gipaplay }
        release { signingConfig signingConfigs.gipaplay }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
